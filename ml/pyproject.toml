[project]
name = "kharcha-ml"
version = "0.1.0"
description = "Offline ML for Kharcha: datasets, distillation, fine-tuning, evals, export (spec §15, §19)."
readme = "README.md"
requires-python = ">=3.11"
# Heavy training deps (transformers, peft, trl, lightgbm, onnx) are added per phase as optional
# groups so CI and laptops without a GPU stay fast.
dependencies = []

[project.scripts]
kharcha-ml = "kharcha_ml.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kharcha_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
